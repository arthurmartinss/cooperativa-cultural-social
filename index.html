<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Conheça a CCS — Cooperativa Cultural Social. Pessoas de diferentes áreas criam juntas projetos de cultura, arte, esporte e tecnologia para a comunidade." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="CCS | Cooperativa Cultural Social" />
    <meta property="og:description" content="Pessoas de diferentes áreas criando juntas projetos culturais e sociais para a comunidade." />
    <meta property="og:url" content="https://cooperativa-cultural-social.vercel.app/" />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      try {
        if (localStorage.getItem('ccs-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#101a29'
        }
      } catch { /* The site still opens in the light theme when storage is unavailable. */ }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/ccs-icone-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/ccs-icone-64.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand/ccs-icone-512.png" />
    <title>CCS | Cooperativa Cultural Social</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
