<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CCS – Cooperativa Cultural Social. Cultura, arte, esporte, tecnologia e comunicação criando oportunidades em conjunto." />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      try {
        if (localStorage.getItem('ccs-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#101a29'
        }
      } catch { /* The site still opens in the light theme when storage is unavailable. */ }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/ccs-icone-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/ccs-icone-64.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand/ccs-icone-512.png" />
    <title>CCS | Cooperativa Cultural Social</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
